<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR Ring Box - Hiro Marker</title>

  <!-- Based on the uploaded AR.js + A-Frame structure -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
    }

    #top-panel {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: min(92vw, 520px);
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.68);
      color: white;
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
      backdrop-filter: blur(4px);
    }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 18px;
      z-index: 20;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 0 12px;
      flex-wrap: wrap;
    }

    button {
      min-width: 150px;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 4px 14px rgba(0,0,0,.22);
    }

    #open-button { background: #ffffff; color: #8b0000; }
    #sparkle-button { background: #ffd54f; color: #5a3b00; }

    .hint {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.8;
    }
  </style>

  <script>
    // Smoothly rotates an object around its local Y axis.
    AFRAME.registerComponent('spin-control', {
      schema: {
        speed: { type: 'number', default: 120 },
        active: { type: 'boolean', default: false }
      },

      tick: function (_time, deltaMs) {
        if (!this.data.active || !deltaMs) return;
        this.el.object3D.rotation.y += THREE.MathUtils.degToRad(
          this.data.speed * deltaMs / 1000
        );
      }
    });

    // Makes the diamond pulse its emissive intensity.
    AFRAME.registerComponent('diamond-sparkle', {
      schema: {
        active: { type: 'boolean', default: false }
      },

      tick: function (time) {
        if (!this.data.active) return;

        const pulse = 1.5 + Math.sin(time * 0.012) * 1.1;
        this.el.setAttribute('material', 'emissiveIntensity', pulse);
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const marker = document.querySelector('#hiro-marker');
      const topPanel = document.querySelector('#top-panel');

      const lid = document.querySelector('#ring-box-lid');
      const sparkleButton = document.querySelector('#sparkle-button');
      const openButton = document.querySelector('#open-button');

      const diamond = document.querySelector('#diamond');
      const diamondGlow = document.querySelector('#diamond-glow');

      let boxOpen = false;
      let sparkle = false;

      marker.addEventListener('markerFound', () => {
        topPanel.innerHTML =
          'พบ Hiro Marker แล้ว — กล่องแหวนพร้อมใช้งาน' +
          '<span class="hint">กดปุ่มเพื่อเปิดกล่องหรือทำให้เพชรเปล่งประกาย</span>';
      });

      marker.addEventListener('markerLost', () => {
        topPanel.innerHTML =
          'เล็งกล้องไปที่ Hiro Marker' +
          '<span class="hint">วาง Marker บนโต๊ะที่มีแสงเพียงพอ และให้เห็นกรอบดำครบทั้งสี่ด้าน</span>';
      });

      // Open / close ring box.
      openButton.addEventListener('click', () => {
        boxOpen = !boxOpen;

        if (boxOpen) {
          lid.setAttribute('animation__open', {
            property: 'rotation',
            to: '-115 0 0',
            dur: 650,
            easing: 'easeOutCubic'
          });

          openButton.textContent = 'ปิดกล่อง';
        } else {
          lid.setAttribute('animation__open', {
            property: 'rotation',
            to: '0 0 0',
            dur: 650,
            easing: 'easeInOutCubic'
          });

          openButton.textContent = 'เปิดกล่อง';
        }
      });

      // Toggle diamond sparkle.
      sparkleButton.addEventListener('click', () => {
        sparkle = !sparkle;

        diamond.setAttribute('diamond-sparkle', 'active', sparkle);

        if (sparkle) {
          diamond.setAttribute('material',
            'color: #ffffff; metalness: 0.15; roughness: 0.03; ' +
            'emissive: #ffffff; emissiveIntensity: 2.2;'
          );

          diamondGlow.setAttribute('visible', true);
          diamondGlow.setAttribute('animation__scale', {
            property: 'scale',
            from: '0.7 0.7 0.7',
            to: '1.35 1.35 1.35',
            dur: 900,
            dir: 'alternate',
            loop: true,
            easing: 'easeInOutSine'
          });

          sparkleButton.textContent = 'หยุดประกายเพชร';
        } else {
          diamond.setAttribute('material',
            'color: #ffffff; metalness: 0.15; roughness: 0.03; ' +
            'emissive: #ffffff; emissiveIntensity: 0.15;'
          );

          diamondGlow.setAttribute('visible', false);
          diamondGlow.removeAttribute('animation__scale');

          sparkleButton.textContent = 'ทำให้เพชรเปล่งประกาย';
        }
      });
    });
  </script>
</head>

<body>
  <div id="top-panel">
    เล็งกล้องไปที่ Hiro Marker
    <span class="hint">อนุญาตให้เว็บไซต์ใช้กล้องเมื่อเบราว์เซอร์ถาม</span>
  </div>

  <div id="controls">
    <button id="open-button" type="button">เปิดกล่อง</button>
    <button id="sparkle-button" type="button">ทำให้เพชรเปล่งประกาย</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; colorManagement: true"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false"
  >
    <a-marker
      id="hiro-marker"
      preset="hiro"
      emitevents="true"
      smooth="true"
      smooth-count="8"
      smooth-tolerance="0.01"
      smooth-threshold="3"
    >

      <!-- =========================
           RING BOX
           ========================= -->

      <!-- Bottom/base of the red ring box -->
      <a-box
        position="0 0.18 0"
        width="1.30"
        height="0.28"
        depth="0.95"
        color="#a50000"
        material="metalness: 0.15; roughness: 0.28;"
      ></a-box>

      <!-- Dark red lower trim -->
      <a-box
        position="0 0.34 0"
        width="1.34"
        height="0.08"
        depth="0.99"
        color="#680000"
        material="metalness: 0.2; roughness: 0.3;"
      ></a-box>

      <!-- White soft mattress / cushion inside -->
      <a-box
        position="0 0.37 0"
        width="1.08"
        height="0.12"
        depth="0.70"
        color="#ffffff"
        material="roughness: 0.85;"
      ></a-box>

      <!-- Slightly rounded-looking inner cushion -->
      <a-cylinder
        position="0 0.43 0"
        rotation="90 0 0"
        radius="0.30"
        height="0.92"
        segments-radial="32"
        color="#f8f8f8"
        scale="1 0.28 1"
        material="roughness: 0.9;"
      ></a-cylinder>

      <!-- Ring -->
      <a-entity position="0 0.62 0">
        <!-- Ring band -->
        <a-torus
          position="0 0 0"
          rotation="90 0 0"
          radius="0.17"
          radius-tubular="0.035"
          segments-radial="32"
          segments-tubular="16"
          color="#d4af37"
          material="metalness: 0.9; roughness: 0.16;"
        ></a-torus>

        <!-- Diamond mount -->
        <a-cone
          position="0 0.15 0"
          radius-bottom="0.085"
          radius-top="0.035"
          height="0.12"
          segments-radial="6"
          color="#d4af37"
          material="metalness: 0.9; roughness: 0.12;"
        ></a-cone>

        <!-- Main diamond -->
        <a-octahedron
          id="diamond"
          position="0 0.27 0"
          radius="0.105"
          color="#ffffff"
          material="metalness: 0.15; roughness: 0.03; emissive: #ffffff; emissiveIntensity: 0.15;"
          diamond-sparkle="active: false"
        ></a-octahedron>

        <!-- Diamond glow -->
        <a-sphere
          id="diamond-glow"
          position="0 0.27 0"
          radius="0.12"
          visible="false"
          color="#ffffff"
          material="transparent: true; opacity: 0.16; emissive: #ffffff; emissiveIntensity: 2;"
        ></a-sphere>
      </a-entity>

      <!-- =========================
           LID
           ========================= -->

      <!--
        Lid pivot is at the rear edge.
        The lid starts closed and rotates backward when opened.
      -->
      <a-entity
        id="ring-box-lid"
        position="0 0.43 -0.475"
        rotation="0 0 0"
      >
        <!-- Red lid -->
        <a-box
          position="0 0.23 0.475"
          width="1.30"
          height="0.46"
          depth="0.95"
          color="#b30000"
          material="metalness: 0.15; roughness: 0.28;"
        ></a-box>

        <!-- White inner lining -->
        <a-box
          position="0 0.02 0.475"
          width="1.08"
          height="0.06"
          depth="0.73"
          color="#ffffff"
          material="roughness: 0.85;"
        ></a-box>

        <!-- Gold decorative edge -->
        <a-box
          position="0 0.47 0.475"
          width="1.18"
          height="0.035"
          depth="0.035"
          color="#d4af37"
          material="metalness: 0.9; roughness: 0.15;"
        ></a-box>
      </a-entity>

      <!-- Small decorative feet -->
      <a-cylinder
        position="-0.48 0.03 -0.34"
        radius="0.055"
        height="0.08"
        color="#d4af37"
        material="metalness: 0.9; roughness: 0.16;"
      ></a-cylinder>

      <a-cylinder
        position="0.48 0.03 -0.34"
        radius="0.055"
        height="0.08"
        color="#d4af37"
        material="metalness: 0.9; roughness: 0.16;"
      ></a-cylinder>

      <a-cylinder
        position="-0.48 0.03 0.34"
        radius="0.055"
        height="0.08"
        color="#d4af37"
        material="metalness: 0.9; roughness: 0.16;"
      ></a-cylinder>

      <a-cylinder
        position="0.48 0.03 0.34"
        radius="0.055"
        height="0.08"
        color="#d4af37"
        material="metalness: 0.9; roughness: 0.16;"
      ></a-cylinder>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
